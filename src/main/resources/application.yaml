spring:
  application:
    name: dormitory-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Cấu hình Jackson Serializer
spring.jackson:
  date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
  time-zone: Asia/Ho_Chi_Minh
  default-property-inclusion: non_null
# OpenAPI & Scalar API Reference Documentation
springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  path: /scalar
  enabled: true
  page-title: "KTX Hub API Reference | Private Dormitory Management System"
  theme: purple
  layout: modern
  show-sidebar: true
  with-default-fonts: true
  default-open-all-tags: true
  order-required-properties-first: true
  persist-auth: true
  search-hot-key: k

# Giám sát hệ thống qua Spring Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

# Cấu hình tham số nghiệp vụ KTX Hub
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}         # 24 giờ
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngày
  mail:
    otp-expiration-seconds: ${OTP_EXPIRATION_SECONDS:300} # 5 phút theo FR-24
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
