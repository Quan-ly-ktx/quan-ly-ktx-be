server:
  port: ${DEV_PORT:8080}

spring:
  datasource:
    hikari:
      pool-name: DormHikariDevPool
      maximum-pool-size: 20
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
  flyway:
    baseline-version: 0

app:
  otp:
    reset-max-per-hour: ${RESET_MAX_PER_HOUR:5}

logging:
  level:
    root: INFO
    com.uit.dormmanagement: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
