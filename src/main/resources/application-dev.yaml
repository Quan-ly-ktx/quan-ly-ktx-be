spring:
  config:
    activate:
      on-profile: dev

  # Database Connection (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_EXTERNAL_PORT:5432}/${POSTGRES_DB:dormitory_db}?currentSchema=public&reWriteBatchedInserts=true
    username: ${POSTGRES_USER:dorm_user}
    password: ${POSTGRES_PASSWORD:dorm_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DormHikariDevPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Spring Data JPA & Hibernate
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Cache & OTP Storage
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_EXTERNAL_PORT:6379}
      password: ${REDIS_PASSWORD:dorm_redis_pass}
      timeout: 3000ms

  # Mail Service (Local/Dev)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.uit.dormmanagement: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
