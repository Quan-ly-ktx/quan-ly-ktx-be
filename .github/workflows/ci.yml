name: Dorm Backend CI flow

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Normalize mvnw line endings and permissions
        run: sed -i 's/\r$//' mvnw && chmod +x mvnw

      - name: Check formatting with Spotless
        run: |
          if ! ./mvnw -B spotless:check; then
            echo "::error::Spotless formatting check failed. Run './mvnw spotless:apply' (or 'make format') locally and commit the formatted files."
            exit 1
          fi

      - name: Run tests
        run: ./mvnw -B test -DfailIfNoTests=false

      - name: Publish JUnit test results
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
