name: dorm

services:
  postgres:
    image: postgres:17-alpine
    container_name: dorm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dormitory_db}
      POSTGRES_USER: ${POSTGRES_USER:-dorm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorm_password}
    ports:
      - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - dorm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dorm_user} -d ${POSTGRES_DB:-dormitory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: dorm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dorm_redis_pass} --appendonly yes --notify-keyspace-events Ex
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - dorm_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dorm_redis_pass} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dorm_postgres_data:
  dorm_redis_data:
